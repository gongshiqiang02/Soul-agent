llm:
  provider: "openai"
  model: "gpt-4o-mini"
  api_key: "${OPENAI_API_KEY}"
  base_url: null
  temperature: 0.7
  max_tokens: 4096

agent:
  max_iterations: 10
  system_prompt_path: null
  planning_enabled: true
  planning_complexity_threshold: 2

memory:
  enabled: true
  db_path: "./data/memory.db"
  vector_db_path: "./data/chroma"
  max_memories_per_query: 5
  importance_threshold: 0.3
  embedding_model: "text-embedding-3-small"

tools:
  enabled:
    - read_file
    - write_file
    - list_directory
    - run_command
    - web_request
    - search_files
  shell:
    timeout: 30
    blocked_commands:
      - "rm -rf /"
      - "format"

ui:
  theme: "monokai"
  stream: true
  show_thinking: false
  language: "zh"
